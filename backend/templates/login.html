<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NutriTrack</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</head>
<body>

<div class="page">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <a href="/" class="brand">Nutri<span>Track</span></a>

    <div class="left-content">
      <h1>Welcome<br><em>back.</em></h1>
      <p>Your personalised diet plan and recipe recommendations are waiting for you.</p>

      <div class="feature-pills">
        <span class="pill">BMI tracking</span>
        <span class="pill">Diet plans</span>
        <span class="pill">Recipe search</span>
        <span class="pill">Calorie tracker</span>
      </div>
    </div>

    <p class="left-footer">© 2025 NutriTrack</p>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="auth-card">

      <div class="auth-card-header">
        <h2>Sign in</h2>
        <p>Enter your credentials to access your dashboard</p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="btn-submit" id="loginBtn">Sign in</button>

      <div id="result"></div>

      <div class="auth-links">
        <a href="#" onclick="showForgot()">Forgot your password?</a>
        <a href="/register-ui">Don't have an account? <strong>Create one</strong></a>
      </div>

    </div>
  </div>

</div>

</body>
</html>
