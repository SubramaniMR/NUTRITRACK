<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | Smart Recipe Tracker</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</head>
<body>

<div class="dashboard">

  <!-- Top bar -->
  <div class="top-bar">
    <h2>Smart Recipe Tracker</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Welcome -->
  <div class="welcome">
    <h1 id="username">Welcome</h1>
    <p>Your health insights for today</p>
  </div>

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <h3>BMI</h3>
      <p id="bmi">{{bmi}}</p>
    </div>

    <div class="card">
      <h3>Category</h3>
      <p id="category">{{category}}</p>
    </div>

    <div class="card">
      <h3>Diet Plan</h3>
      <p id="diet">{{diet_plan}}</p>
    </div>

    <div class="card">
      <h3>Daily Calories</h3>
      <p id="calories">{{daily_calories}}</p>
    </div>
  </div>

<div class="calorie-tracker">

    <h3>Daily Calorie Tracker</h3>

    <p>
        <span id="consumedCalories">0</span> /
        <span id="targetCalories">0</span> kcal
    </p>

    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>

</div>

  <div class="recipe-controls">

    <input 
        type="text"
        id="searchInput"
        placeholder="Search recipes..."
        onkeyup="searchRecipes()"
    >

    <select id="calorieFilter" onchange="searchRecipes()">
        <option value="">All Calories</option>
        <option value="low">Low (0-200 kcal)</option>
        <option value="medium">Medium (200-400 kcal)</option>
        <option value="high">High (400+ kcal)</option>
    </select>

  </div>

  <!-- Recipes -->
  <div class="recipes">
    <h2 id="searchTitle" style="display: none;">Search Result</h2>
    <div id="searchContainer" class="recipe-grid"></div>
    <h2>Recommended Recipes</h2>
    <div id="recipeContainer" class="recipe-grid"></div>
  </div>

</div>

</body>
</html>
